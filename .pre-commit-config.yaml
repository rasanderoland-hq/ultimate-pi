# pre-commit framework hook (optional layer; the global core.hooksPath hook
# from rasande-knowledge scripts/git-hooks/ runs gitleaks even without this).
# Install: pre-commit install   Verify: pre-commit run gitleaks --all-files
# Docs: rasande-knowledge docs/quality/secret-scanning-strategy.md (ROE-640)
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
